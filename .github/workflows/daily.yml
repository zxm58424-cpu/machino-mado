name: Daily live camera update and deploy

on:
  push:
    branches: [main]
    paths:
      - 'live-preview.js'
      - 'live-preview.css'
      - 'update_site.py'
      - 'app.js'
      - 'style.css'
      - 'template.html'
      - '.github/workflows/daily.yml'
  schedule:
    # 毎日 10:17 JST (01:17 UTC)。GitHub側の遅延あり。
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: machino-mado-daily
  cancel-in-progress: false

jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.build.outputs.updated }}
    steps:
      - name: Checkout repository and persistent SQLite state
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect video candidates and rebuild website
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] && [ -z "$YOUTUBE_API_KEY" ]; then
            echo 'YOUTUBE_API_KEY repository secret is missing' >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            python auto_update.py --site-only
          else
            python auto_update.py
          fi
      - name: Save SQLite progress and new site to repository
        id: build
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html catalog.json data/全動画候補.csv data/全チャンネル候補.csv \
            日本ライブカメラ収集DB/livecam.sqlite 日本ライブカメラ収集DB/収集状況.json
          if git diff --cached --quiet; then
            echo 'No relevant changes'
            echo 'updated=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'chore: daily camera catalog refresh'
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo 'updated=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build minimal publication directory
        run: |
          mkdir -p public
          cp index.html public/index.html
          touch public/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: collect-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
